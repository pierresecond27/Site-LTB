<!doctype html>
<html lang="fr">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Site de l'école</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="asset/contact/style_contact/contact.css">
</head>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<body>
    
            
      <main>
      <!-- le contenu de la page -->
      <!-- fin du contenu de la page -->
    </main>

    <script src="asset/bootstrap/js/bootstrap.min.js"></script>
    <section class="hero-banner text-center text-uppercase">
        <div class="container position-relative ">
            <h1 class="display-5 hero-title ">Contact</h1>
        </div>
    </section>
    <main class="container my-5 py-3">
        <div class="row g-5">
            <div class="col-lg-5">
                <div class="d-flex align-items-start mb-4">
                    <div class="info-icon-circle me-3">
                        <a href="tel:+241000000">
                            <i class="fas fa-phone" style="color: #faf6f6;"></i>
                            
                        </a>
                        <i class="bi bi-telephone-fill"></i>
                    </div>
                    <div>
                        <small class="text-muted d-block text-uppercase fw-bold">Phone</small>
                        <span class="fw-semibold">+241 011 46 58 99</span>
                    </div>
                </div>

                <div class="d-flex align-items-start mb-4">
                    <div class="info-icon-circle me-3">
                       <i class="fas fa-home"></i>
                    </div>
                    <div>
                        <small class="text-muted d-block text-uppercase fw-bold"> Adresse</small>
                        <span class="fw-semibold">Bikélé, Libreville, Gabon</span>
                    </div>
                </div>

                <div class="d-flex align-items-start mb-4">
                    <div class="info-icon-circle me-3">
                        <p> <i class="far fa-clock"></i></p>
                        <i class="bi bi-clock-fill"></i>
                    </div>
                    <div>
                        <small class="text-muted d-block text-uppercase fw-bold">Opening Time</small>
                        <span class="fw-semibold">8:00H - 15:30H</span>
                    </div>
                </div>

                <div class="mt-5">
                    <iframe class="map-placeholder"
                        <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3989.7431448839447!2d9.5824982!3d0.3275916!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x136f175a3cce55af%3A0xe5a421c5dfb18a81!2sLycee%20Technique%20de%20BIKELE!5e0!3m2!1sfr!2s!4v1710000000000!5m2!1sfr!2s" 
        style="border:0;" 
        allowfullscreen="" 
        loading="lazy" 
        referrerpolicy="no-referrer-when-downgrade">
</iframe>
                </div>
            </div>

          <div class="col-lg-7">
                <div class="contact-form-container p-4 p-md-5"><br>
                    <h2 class="h3 mb-4 fw-bold" style="color: var(--primary-color);">Nous contacter</h2>

                    <form>
                        <div class="mb-3">
                            <label for="name" class="form-label small fw-bold">Nom</label>
                            <input type="text" class="form-control" id="name" placeholder="Entrer votre nom" required>
                        </div>
                        <div class="mb-3">
                            <label for="phone" class="form-label small fw-bold">Telephne</label>
                            <input type="tel" class="form-control" id="phone" placeholder="Entrer votre votre numero"
                                required>
                        </div>
                        <div class="mb-3">
                            <label for="email" class="form-label small fw-bold">Email</label>
                            <input type="email" class="form-control" id="email" placeholder="Entre votre  email"
                                required>
                        </div>
                        <div class="mb-4">
                            <label for="message" class="form-label small fw-bold">Ecrivez votre Message</label>
                            <textarea class="form-control" id="message" rows="5" placeholder="Votre message ici..."
                                required></textarea>
                        </div>
                        <button type="submit" class="btn btn-custom w-auto shadow-sm">Envoyer</button>
                    </form>
                </div>
            </div>

        </div>
    </main>
   
    <!-- debut footer -->

    


    <script src="asset/bootstrap/js/bootstrap.min.js"></script>
</body>

</html>
